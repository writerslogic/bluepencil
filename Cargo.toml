[workspace]
resolver = "2"
members = ["crates/bluepencil", "crates/bluepencil-core"]
exclude = ["crates/bluepencil-lsp", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/writerslogic/bluepencil"
homepage = "https://github.com/writerslogic/bluepencil"
authors = ["David Condrey"]

[workspace.dependencies]
bluepencil-core = { path = "crates/bluepencil-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
