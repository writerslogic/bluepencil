  <text x="112" y="62" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="-1.5" fill="#f2f4f0">bluepencil<tspan fill="#8bb4ff">.</tspan></text>
  <text x="55" y="145" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#8bb4ff">THE PRIVATE PROSE PLAYGROUND</text>
  <text x="55" y="235" font-family="Georgia,serif" font-size="61" letter-spacing="-3" fill="#f4f1e9">Find the lines worth</text>
  <text x="55" y="315" font-family="Georgia,serif" font-size="73" font-style="italic" letter-spacing="-3" fill="#8bb4ff">another look.</text>
  <text x="59" y="375" font-family="Arial,sans-serif" font-size="20" fill="#becbd0">A private, local prose playground.</text>
  <text x="59" y="406" font-family="Arial,sans-serif" font-size="20" fill="#becbd0">Specific observations. Your judgment.</text>
  <rect x="657" y="127" width="488" height="362" rx="19" fill="url(#page)" stroke="#536d80"/>
  <path d="M657 183H1145" stroke="#435a69"/>
  <circle cx="690" cy="155" r="7" fill="#d8ab65"/>
  <text x="709" y="162" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#e8f0ee">What stands out</text>
  <rect x="679" y="205" width="444" height="118" rx="11" fill="#294153" stroke="#718fa6"/>
  <text x="702" y="236" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#d8ab65">ECHO  ·  IN YOUR DRAFT</text>
  <text x="702" y="270" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f4f0">A word reappears nearby</text>
  <text x="702" y="297" font-family="Georgia,serif" font-size="15" fill="#bfcdd3">The lobby smelled of wet wool and coffee.</text>
  <rect x="679" y="335" width="444" height="118" rx="11" fill="#294153" stroke="#718fa6"/>
  <text x="702" y="366" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#d8ab65">REPEATED STARTER  ·  IN YOUR DRAFT</text>
  <text x="702" y="400" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f4f0">Three sentences start with “she”</text>
  <text x="702" y="427" font-family="Georgia,serif" font-size="15" fill="#bfcdd3">She looked at the staircase.</text>
  <text x="59" y="588" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#d8ab65">A WritersLogic project</text>
  <text x="1139" y="588" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#9fb1ba">writerslogic.github.io/bluepencil</text>
