<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bluepencil report</title>
<style>{{css}}</style>
</head>
<body>
<main>
<header><h1>bluepencil report</h1><p class="muted">Generated by bluepencil {{version}}</p></header>
<section><h2>Overview</h2><div class="stats">{{overview}}</div></section>
<section><h2>Flags</h2><div class="scroll"><table><thead><tr><th>Flag</th><th>Count</th><th>Per 1k words</th><th></th></tr></thead><tbody>{{flags}}</tbody></table></div></section>
<section class="grid">
<div><h2>Top words</h2>{{top_words}}</div>
<div><h2>Top sentence openers</h2>{{top_starters}}</div>
<div><h2>Repeated phrases</h2>{{top_repeats}}</div>
</section>
{{by_file}}
</main>
</body>
</html>
