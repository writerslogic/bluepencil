[package]
name = "bluepencil-lsp"
description = "Language server for bluepencil: echoes, passive voice, clichés, and more as editor diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["writing", "prose", "lsp", "language-server", "editing"]
categories = ["text-processing", "development-tools"]

[[bin]]
name = "bluepencil-lsp"
path = "src/main.rs"

[dependencies]
bluepencil-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp.workspace = true
