name: Release Node package

# Manual only. Cross-compiles the napi addon in crates/bluepencil-node for
# every target package.json's `napi.targets` declares, then publishes the
# per-platform packages and the root `bluepencil` npm package. Needs an
# NPM_TOKEN secret with publish rights; without it the build matrix still
# runs and uploads artifacts, only the publish job fails.
on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/bluepencil-node

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: crates/bluepencil-node/package-lock.json
      - run: npm ci
      - name: Build addon (${{ matrix.target }})
        run: npm run build -- --target ${{ matrix.target }}
      - name: Smoke test on the host target
        if: matrix.target != 'x86_64-apple-darwin'
        run: npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: crates/bluepencil-node/*.node
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: crates/bluepencil-node/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: crates/bluepencil-node/artifacts
          merge-multiple: true
      - name: Create per-platform packages
        run: npx napi create-npm-dirs
      - name: Move artifacts into place
        run: npx napi artifacts --output-dir artifacts
      # `npm publish` runs prepublishOnly (`napi prepublish -t npm`), which
      # publishes every platform package, then npm publishes the root.
      - name: Publish
        run: |
          npm config set provenance true
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
