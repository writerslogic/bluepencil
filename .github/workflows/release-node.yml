name: Release Node package

# Runs on every release tag so the npm package ships with the workspace version
# (the version_sync test keeps package.json equal to Cargo.toml), and on demand
# for a retry. Cross-compiles the napi addon in crates/bluepencil-node for every
# target package.json's `napi.targets` declares, then publishes the per-platform
# packages and the root `bluepencil-node` npm package. Publishing needs npm
# trusted publishing for this workflow or an NPM_TOKEN secret with publish
# rights; without either the build matrix still runs and uploads artifacts,
# only the publish job fails.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/bluepencil-node

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag that disagrees with package.json would publish the wrong version.
      - name: Require the release tag to match package.json
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match bluepencil-node $version" >&2; exit 1; }
      # npm versions are immutable, so a retry must not fail on one already there.
      - name: Skip a version that is already on npm
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "bluepencil-node@${version}" version >/dev/null 2>&1; then
            echo "bluepencil-node ${version} is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: crates/bluepencil-node/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Build addon (${{ matrix.target }})
        run: npm run build -- --target ${{ matrix.target }}
      - name: Smoke test on the host target
        if: matrix.target != 'x86_64-apple-darwin'
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: crates/bluepencil-node/*.node
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: crates/bluepencil-node/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: crates/bluepencil-node/artifacts
          merge-multiple: true
      - name: Create per-platform packages
        run: npx napi create-npm-dirs
      - name: Move artifacts into place
        run: npx napi artifacts --output-dir artifacts
      # `npm publish` runs prepublishOnly (`napi prepublish -t npm --no-gh-release`),
      # which publishes every platform package, then npm publishes the root. The
      # GitHub release is dist's job (release.yml), so napi must not touch it.
      - name: Publish
        run: |
          npm config set provenance true
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
