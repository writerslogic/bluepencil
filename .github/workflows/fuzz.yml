name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    paths: ["fuzz/**", "crates/bluepencil-core/src/parse/**"]

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run parse -- -max_total_time=180
