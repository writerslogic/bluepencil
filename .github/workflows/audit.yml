name: Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml"]

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
