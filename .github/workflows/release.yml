# Replace this file with the output of `dist init` once cargo-dist is installed.
# Until then it builds release binaries for each tag and attaches them to the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p bluepencil --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir=bluepencil-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$dir"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir"/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/bluepencil.exe "$dir"/
            7z a "$dir.zip" "$dir"
          else
            cp target/${{ matrix.target }}/release/bluepencil "$dir"/
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: bluepencil-*.*
