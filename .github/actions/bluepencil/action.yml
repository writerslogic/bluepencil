name: bluepencil prose review
description: Analyze changed writing files and attach bluepencil observations to the workflow run
inputs:
  base-sha:
    description: Base commit SHA for a pull request; omit to review all tracked writing files
    required: false
  limit:
    description: Maximum number of observations to annotate
    required: false
    default: '25'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - name: Install bluepencil
      shell: bash
      run: cargo install --locked --path "$GITHUB_ACTION_PATH/../../../crates/bluepencil" --bin bluepencil
    - name: Review writing
      shell: bash
      env:
        BLUEPENCIL_BASE_SHA: ${{ inputs.base-sha }}
        BLUEPENCIL_LIMIT: ${{ inputs.limit }}
      run: node "$GITHUB_ACTION_PATH/annotate.mjs"
