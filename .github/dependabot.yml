version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # release.yml is generated by `dist generate` (see dist-workspace.toml) and pins
      # whatever actions/checkout version the installed cargo-dist's template uses;
      # bumping it here drifts from that template and fails the `plan` job. Goes up
      # only when cargo-dist itself is upgraded.
      - dependency-name: "actions/checkout"
      # Pinned to the project's MSRV (matches Cargo.toml's rust-version), not "latest
      # stable". Move it deliberately alongside a rust-version bump, never on its own.
      - dependency-name: "dtolnay/rust-toolchain"
        versions: ["1.x"]
